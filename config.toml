[display]
width = 1280
height = 720
fullscreen = false
index = 0 # Run --list-displays after connecting HDMI, then select the projector.
fps = 60

[projector]
ip = "10.31.171.250"
name = "HY300PRO"
transport = "hdmi"

[camera]
device = 0 # Run --list-cameras; index 0 is often the built-in laptop camera, not the Arducam.
backend = "" # Empty picks avfoundation on macOS and v4l2 on Linux; override for an unusual host.
width = 1280
height = 720
fps = 30
calibration_file = "calibration.npz"
marker_clip_limit = 8.0 # Local contrast equalization for calibration markers; 0 disables it.
marker_tiles = 16
marker_memory_seconds = 2.0 # Hold the rig still; markers seen this recently count together.
wall_threshold = 75
wall_update_hz = 10
wall_persistence = 3
laser_min_area = 1
laser_max_area = 180
identity_interval = 1.5
identity_window = 0.18
identity_settle = 0.08
stale_seconds = 0.5

[network]
bind = "0.0.0.0"
port = 4210
timeout = 0.5

[game]
players = 3
width = 1280
height = 720
canoe_speed = 240.0
turn_speed = 240.0
aim_deadzone = 24.0
beaver_speed = 75.0
beaver_boost_speed = 150.0
shot_interval = 0.30
magazine = 3
reload_seconds = 2.5
rock_speed = 650.0
rock_lifetime = 2.0
invulnerability = 0.8
winning_score = 5
shape_gap = 5
shape_min_area = 400
shape_max_fraction = 0.25
round_delay = 3.0
seed = 2026

[feedback]
enabled = true
duration_ms = 200
